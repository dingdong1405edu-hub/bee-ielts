[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev --legacy-peer-deps && npx prisma generate && npx next build"

[deploy]
startCommand = "npx prisma db push --accept-data-loss --skip-generate && npx prisma db seed && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
